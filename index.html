<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IU Dining Calorie Tracker</title>
  <style>
    :root {
      --iu-crimson: #990000;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --subtext: #a0a0a0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    header {
      grid-column: 1 / -1;
      background: var(--iu-crimson);
      padding: 15px 20px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { margin: 0; font-size: 1.5rem; }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    select, input, button {
      background: #2d2d2d;
      color: var(--text);
      border: 1px solid #444;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background: var(--iu-crimson);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    .item-meta { font-size: 0.85rem; color: var(--subtext); }

    .stat-box {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      margin-bottom: 15px;
    }

    .stat-number { font-size: 2rem; font-weight: bold; color: #4caf50; }

    .logged-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ff5252;
      cursor: pointer;
      padding: 0 5px;
      width: auto;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>IU Dining Calorie Tracker</h1>
    <small>Hosted on Luddy Silo</small>
  </header>

  <main>
    <div class="card">
      <h2>Find Food</h2>
      <div class="controls">
        <select id="locationSelect">
          <option value="">Loading locations...</option>
        </select>
        <select id="mealSelect" disabled>
          <option value="">Select Location First</option>
        </select>
        <input type="date" id="dateSelect">
        <button id="fetchBtn" onclick="fetchMenu()">Get Menu</button>
      </div>

      <div id="menuContainer">
        <p style="color: var(--subtext);">Select a location and meal to view items.</p>
      </div>
    </div>
  </main>

  <aside class="tracker-summary">
    <div class="card">
      <h2>Daily Log</h2>
      <div class="stat-box">
        <div>Total Calories</div>
        <div class="stat-number" id="totalCals">0</div>
      </div>
      
      <h3>Logged Items</h3>
      <div id="loggedItems">
        <p style="color: var(--subtext); font-size: 0.9rem;">No items added yet.</p>
      </div>
      <button onclick="clearLog()" style="margin-top: 15px; background: #444;">Clear Today's Log</button>
    </div>
  </aside>
</div>

<script>
  let locations = [];
  let loggedFood = JSON.parse(localStorage.getItem('iu_cals_log')) || [];

  document.getElementById('dateSelect').valueAsDate = new Date();

  // Multi-proxy with automatic JSON unwrapping
  async function fetchMultiProxy(targetUrl) {
    const proxies = [
      url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://thingproxy.freeboard.io/fetch/${url}`
    ];

    let lastError = null;

    for (const createProxyUrl of proxies) {
      try {
        const proxyUrl = createProxyUrl(targetUrl);
        const res = await fetch(proxyUrl);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        let raw = await res.json();
        
        // Handle AllOrigins wrapper output format ({ contents: "..." })
        if (raw && raw.contents) {
          try {
            raw = JSON.parse(raw.contents);
          } catch (e) {
            raw = raw.contents;
          }
        }

        if (typeof raw === 'string' && raw.trim().startsWith('<')) {
          throw new Error("Proxy returned HTML instead of JSON");
        }

        return raw;
      } catch (err) {
        lastError = err;
      }
    }

    throw new Error(lastError ? lastError.message : "All proxies failed.");
  }

  async function loadLocations() {
    const select = document.getElementById('locationSelect');
    
    try {
      // Try fetching live list from API
      const primaryUrl = 'https://indiana-dining.nutrislice.com/menu/api/schools/?format=json';
      let resData = await fetchMultiProxy(primaryUrl);

      // Handle standard Nutrislice response formats
      if (Array.isArray(resData)) {
        locations = resData;
      } else if (resData && Array.isArray(resData.schools)) {
        locations = resData.schools;
      } else if (resData && Array.isArray(resData.results)) {
        locations = resData.results;
      }

      if (!locations || locations.length === 0) {
        throw new Error("No array found in API response");
      }

      populateLocationDropdown();
    } catch (err) {
      console.warn("API location fetch failed, using known IU locations fallback:", err);
      
      // Known IU Nutrislice Locations fallback if API listing is blocked
      locations = [
        {
          name: "McNutt Dining Hall",
          slug: "mcnutt-dining-hall",
          active_menu_types: [
            { name: "Breakfast", slug: "breakfast" },
            { name: "Lunch", slug: "lunch" },
            { name: "Dinner", slug: "dinner" }
          ]
        },
        {
          name: "Forest Dining Hall",
          slug: "forest-dining-hall",
          active_menu_types: [
            { name: "Breakfast", slug: "breakfast" },
            { name: "Lunch", slug: "lunch" },
            { name: "Dinner", slug: "dinner" }
          ]
        },
        {
          name: "Collins Eatery",
          slug: "collins-eatery",
          active_menu_types: [
            { name: "Lunch", slug: "lunch" },
            { name: "Dinner", slug: "dinner" }
          ]
        },
        {
          name: "Goodbody Hall Eatery",
          slug: "goodbody-hall-eatery",
          active_menu_types: [
            { name: "Lunch", slug: "lunch" },
            { name: "Dinner", slug: "dinner" }
          ]
        }
      ];

      populateLocationDropdown();
    }
  }

  function populateLocationDropdown() {
    const select = document.getElementById('locationSelect');
    select.innerHTML = '<option value="">Select Location</option>';
    
    locations.forEach(loc => {
      const opt = document.createElement('option');
      opt.value = loc.slug;
      opt.textContent = loc.name;
      select.appendChild(opt);
    });

    select.addEventListener('change', populateMeals);
  }

  function populateMeals() {
    const locSlug = document.getElementById('locationSelect').value;
    const mealSelect = document.getElementById('mealSelect');
    
    if (!locSlug) {
      mealSelect.disabled = true;
      return;
    }

    const loc = locations.find(l => l.slug === locSlug);
    mealSelect.innerHTML = '';
    
    if (loc && loc.active_menu_types && loc.active_menu_types.length > 0) {
      loc.active_menu_types.forEach(menu => {
        const opt = document.createElement('option');
        opt.value = menu.slug;
        opt.textContent = menu.name;
        mealSelect.appendChild(opt);
      });
      mealSelect.disabled = false;
    } else {
      // Generic fallback options if dynamic meal types are empty
      ['breakfast', 'lunch', 'dinner'].forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m.charAt(0).toUpperCase() + m.slice(1);
        mealSelect.appendChild(opt);
      });
      mealSelect.disabled = false;
    }
  }

  async function fetchMenu() {
    const loc = document.getElementById('locationSelect').value;
    const meal = document.getElementById('mealSelect').value;
    const dateVal = document.getElementById('dateSelect').value;

    if (!loc || !meal || !dateVal) {
      alert("Please select a location, meal type, and date.");
      return;
    }

    const [year, month, day] = dateVal.split('-');
    const container = document.getElementById('menuContainer');
    container.innerHTML = '<p>Loading menu & nutrition data...</p>';

    try {
      const url = `https://indiana-dining.nutrislice.com/menu/api/weeks/school/${loc}/menu-type/${meal}/${year}/${month}/${day}/?format=json`;
      const data = await fetchMultiProxy(url);
      renderMenu(data, dateVal);
    } catch (err) {
      container.innerHTML = `<p style="color:red;">Error fetching menu: ${err.message}</p>`;
    }
  }

  function renderMenu(data, selectedDate) {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';

    const dayData = data && data.days ? data.days.find(d => d.date === selectedDate) : null;

    if (!dayData || !dayData.menu_items || dayData.menu_items.length === 0) {
      container.innerHTML = '<p>No menu items available for this date/meal selection.</p>';
      return;
    }

    dayData.menu_items.forEach(item => {
      if (!item.food || !item.food.name) return;

      const food = item.food;
      const cals = food.calories || 0;
      const protein = food.protein || 'N/A';
      const carbs = food.carbohydrates || 'N/A';
      const fat = food.total_fat || 'N/A';
      const size = food.serving_size ? `(${food.serving_size})` : '';

      const div = document.createElement('div');
      div.className = 'menu-item';
      div.innerHTML = `
        <div class="item-info">
          <h4 style="margin: 0 0 5px 0;">${food.name} <small style="color:#aaa">${size}</small></h4>
          <div class="item-meta">
            <strong>${cals} Cals</strong> | P: ${protein}g | C: ${carbs}g | F: ${fat}g
          </div>
        </div>
        <button onclick="addFood('${escapeQuotes(food.name)}', ${cals})" style="width: auto;">+ Add</button>
      `;
      container.appendChild(div);
    });
  }

  function escapeQuotes(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function addFood(name, cals) {
    loggedFood.push({ id: Date.now(), name, cals });
    saveAndRenderLog();
  }

  function removeFood(id) {
    loggedFood = loggedFood.filter(item => item.id !== id);
    saveAndRenderLog();
  }

  function clearLog() {
    loggedFood = [];
    saveAndRenderLog();
  }

  function saveAndRenderLog() {
    localStorage.setItem('iu_cals_log', JSON.stringify(loggedFood));
    
    const container = document.getElementById('loggedItems');
    const totalEl = document.getElementById('totalCals');
    
    container.innerHTML = '';
    let totalCals = 0;

    if (loggedFood.length === 0) {
      container.innerHTML = '<p style="color: var(--subtext); font-size: 0.9rem;">No items added yet.</p>';
    } else {
      loggedFood.forEach(item => {
        totalCals += item.cals;
        const div = document.createElement('div');
        div.className = 'logged-item';
        div.innerHTML = `
          <span>${item.name} (${item.cals} cal)</span>
          <button class="btn-remove" onclick="removeFood(${item.id})">&times;</button>
        `;
        container.appendChild(div);
      });
    }

    totalEl.textContent = totalCals;
  }

  loadLocations();
  saveAndRenderLog();
</script>
</body>
</html>
